name: Setup Repository

on:
  workflow_run:
    workflows: ["Initialize Repository"]
    types:
      - completed

permissions:
  contents: write

jobs:
  setup:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      vars.IS_TEMPLATE != 'true'

    runs-on: ubuntu-latest

    steps:
      # Checkout latest main (after README update)
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Sync latest main
        run: |
          git fetch origin
          git checkout main
          git pull origin main

      # Check if dev branch already exists
      - name: Check if dev branch exists
        id: dev_check
        run: |
          if git ls-remote --heads origin dev | grep dev; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Create dev branch ONLY if not exists
      - name: Create dev branch
        if: steps.dev_check.outputs.exists != 'true'
        run: |
          git checkout -b dev
          git push origin dev

      # Check if GH_PAT is available
      - name: Check GH_PAT exists
        id: pat_check
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "has_pat=false" >> $GITHUB_OUTPUT
          else
            echo "has_pat=true" >> $GITHUB_OUTPUT
          fi

      # Set dev as default branch (only if PAT exists)
      - name: Set default branch to dev
        if: steps.pat_check.outputs.has_pat == 'true'
        run: |
          curl -X PATCH \
          -H "Authorization: token ${{ secrets.GH_PAT }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }} \
          -d '{"default_branch":"dev"}'

      # Protect main branch
      - name: Protect main branch
        if: steps.pat_check.outputs.has_pat == 'true'
        run: |
          curl -X PUT \
          -H "Authorization: token ${{ secrets.GH_PAT }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/branches/main/protection \
          -d '{
            "required_status_checks": {
              "strict": true,
              "contexts": ["CI"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1
            },
            "restrictions": null
          }'

      # Protect dev branch
      - name: Protect dev branch
        if: steps.pat_check.outputs.has_pat == 'true'
        run: |
          curl -X PUT \
          -H "Authorization: token ${{ secrets.GH_PAT }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/branches/dev/protection \
          -d '{
            "required_status_checks": {
              "strict": true,
              "contexts": ["CI"]
            },
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "required_approving_review_count": 0
            },
            "restrictions": null
          }'